name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # The dependency-review action needs GitHub's Dependency Graph enabled,
    # which is not available on this fork — it errors out and fails the PR.
    # Restrict it to upstream so it simply skips here (enable Dependency Graph
    # in repo Settings → Code security and analysis to run it on the fork).
    if: github.repository == 'sws2apps/organized-app'

    steps:
      - name: Checkout for dependency review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Running Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
